# 本地依赖环境：MySQL 8 + Redis
#
# 用法：
#   cd deploy && docker compose up -d
#
# 端口：
#   MySQL 3306（audit/audit）
#   Redis  6379

services:
  mysql:
    image: mysql:8.0
    container_name: audit-platform-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: audit_platform
      MYSQL_USER: audit
      MYSQL_PASSWORD: audit
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: audit-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
